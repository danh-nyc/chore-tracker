{% extends "layout.html" %}

{% block title %}Goody! | Create Kid{% endblock %}

{% block content %}
    <form method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Kid's Username</label>
            <input class="form-control" id="username" name="username" placeholder="username" type="text">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Kid's Password</label>
            <input class="form-control" id="password" name="password" placeholder="password" type="password">
        </div>
        <div class="mb-3">
            <label for="confirm" class="form-label">Confirm Password</label>
            <input class="form-control" id="confirm" name="confirm" placeholder="password" type="password">
        </div>
        <div>
            <button class="btn btn-primary" type="submit">Register</button>
        </div>
    </form>

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

{% endblock %}
